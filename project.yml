name: Memora
options:
  bundleIdPrefix: com.rashid
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Memora:
    type: application
    platform: iOS
    sources:
      - path: Memora
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rashid.memora
        PRODUCT_NAME: Memora
        INFOPLIST_FILE: Memora/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/Memora.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: MemoraWidget
        embed: true
      - sdk: WidgetKit.framework

  MemoraWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MemoraWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rashid.memora.widget
        PRODUCT_NAME: MemoraWidget
        INFOPLIST_FILE: MemoraWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/MemoraWidget.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  MemoraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MemoraTests
    dependencies:
      - target: Memora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rashid.memora.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Memora.app/Memora"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGNING_ALLOWED: NO

schemes:
  Memora:
    build:
      targets:
        Memora: all
        MemoraTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MemoraTests
    archive:
      config: Release
